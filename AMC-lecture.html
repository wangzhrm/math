<!-- ============ Styles shared by the app AND the exported HTML file ============ -->
<style id="content-style">

.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }

/* Practice questions */
.practice { margin-top: 30px; }
.practice-label { font-family: var(--sans); font-size: 14px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }

.q-block { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 6px; padding: 22px 0 24px; border-top: 1px solid var(--line); break-inside: avoid; }

.solution.open { display: block; }
.sol-label { font-family: var(--sans); font-size: 12.5px; font-weight: 700; color: var(--green); margin-bottom: 6px; }
.sol-text { font-family: var(--serif); font-size: 17px; line-height: 1.75; overflow-wrap: anywhere; }

@media (max-width: 640px) {

    .q-num { margin-bottom: 6px; }

    const list = els.flat().filter(Boolean);

        setTimeout(() => typeset(list), 200);

        .then(() => MathJax.startup.promise)
        .then(() => MathJax.typesetPromise(list))
        .catch(e => console.warn('MathJax:', e));
}
function setHTML(el, html) {
    if (window.MathJax && MathJax.typesetClear) { try { MathJax.typesetClear([el]); } catch (e) {} }
    el.innerHTML = html;
}

/* ------------------------------------------------- markdown + LaTeX rendering
   LaTeX is lifted out before Markdown/HTML processing (so underscores, stars and
   < > inside formulas survive) and put back afterwards for MathJax to typeset.  */
const MATH_RE = /(?<!\\)\$\$[\s\S]+?(?<!\\)\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\\begin\{([a-zA-Z*]+)\}[\s\S]+?\\end\{\1\}|(?<!\\)\$(?:\\.|[^$\\\n])+\$/g;

function stashMath(src) {
    const stash = [];
    const text = String(src ?? '').replace(MATH_RE, m => { stash.push(m); return '\uE000' + (stash.length - 1) + '\uE001'; });
    return { text, stash };
}
function restoreMath(html, stash) {
    return html.replace(/\uE000(\d+)\uE001/g, (_, i) => esc(stash[+i]));
}
function renderMarkdown(md) {
    const { text, stash } = stashMath(md);
    let html;
    try { html = marked.parse(text, { gfm: true, breaks: false }); }
    catch (e) { html = '<p>' + esc(text) + '</p>'; }
    return restoreMath(DOMPurify.sanitize(html), stash);
}
// Question / solution text: same treatment as the editor preview (line breaks kept), but sanitised.
function renderRich(txt) {
    const { text, stash } = stashMath(txt);
    return restoreMath(DOMPurify.sanitize(text.replace(/\r?\n/g, '<br>')), stash);
}

/* -------------------------------------------------------------------- state */
const state = {
    mode: 'view',
    chapters: [],
    currentId: null,
    draft: null,
    dirty: false,
    saving: false,
    authed: false,
    printSolutions: false,
    renderToken: 0
};
const currentChapter = () => state.chapters.find(c => c.id === state.currentId) || null;
const qCache = new Map(); // question id -> data | null (missing)

/* --------------------------------------------------------------- data layer */
async function loadChapters() {
    const snap = await getDocs(collection(db, COL_CHAPTER));
    const list = [];
    snap.forEach(d => {
        const x = d.data();
        list.push({
            id: d.id,
            title: x.title || 'Untitled chapter',
            order: typeof x.order === 'number' ? x.order : 0,
            _created: millis(x.createdAt),
            knowledges: (x.knowledges || []).map(k => ({
                id: k.id || uid(),
                markdown: k.markdown || '',
                questionIds: Array.isArray(k.questionIds) ? k.questionIds : []
            }))
        });
    });
    list.sort((a, b) => (a.order - b.order) || (a._created - b._created));
    state.chapters = list;
}

async function ensureQuestions(ids, force) {
    const need = [...new Set(ids)].filter(id => force || !qCache.has(id));
    await Promise.all(need.map(async id => {
        try {
            const s = await getDoc(doc(db, COL_QUESTION, id));
            qCache.set(id, s.exists() ? s.data() : null);
        } catch (e) { console.error(e); qCache.delete(id); }
    }));
}

/* ---------------------------------------------------------- HTML builders */
function questionBlockHTML(qid, n, opt = {}) {
    const q = qCache.get(qid);
    const tools = opt.manage ? `
        <span class="manage-only" style="margin-left:auto; display:flex; gap:6px;">
            <button class="mini" data-act="q-up" data-k="${opt.k}" data-q="${opt.qi}" title="Move up">↑</button>
            <button class="mini" data-act="q-down" data-k="${opt.k}" data-q="${opt.qi}" title="Move down">↓</button>
            <button class="mini danger" data-act="q-remove" data-k="${opt.k}" data-q="${opt.qi}">Remove</button>
        </span>` : '';
    if (!q) {
        return `<div class="q-block missing"><div class="q-num">${n}</div><div class="q-main">
            <div class="q-flags">${tools}</div>
            <p class="muted">This question is no longer in the database. Remove it from this knowledge.</p></div></div>`;
    }
    const diag = q.diagramUrl
        ? `<figure class="q-diagram"><img src="${esc(q.diagramUrl)}" alt="Diagram for question ${n}" loading="lazy" onerror="this.closest('figure').style.display='none'"></figure>` : '';
    const diff = q.isDifficult ? '<span class="badge-diff">Difficult</span>' : '';
    const flags = (diff || tools) ? `<div class="q-flags">${diff}${tools}</div>` : '';
    const open = !!opt.openAll;
    return `<div class="q-block">
        <div class="q-num">${n}</div>
        <div class="q-main">
            ${flags}
            <div class="q-body"><div class="q-text">${renderRich(q.latexQuestion)}</div>${diag}</div>
            <button type="button" class="sol-btn" data-act="toggle-sol">${open ? 'Hide solution' : 'Show solution'}</button>
            <div class="solution${open ? ' open' : ''}"><div class="sol-label">Solution</div><div class="sol-text">${renderRich(q.latexSolution)}</div></div>
        </div>
    </div>`;
}

// Read-only chapter markup, used by the view mode and the HTML export.
function buildChapterHTML(ch, opt = {}) {
    let n = 0;
    const ks = ch.knowledges.map(k => {
        const qs = k.questionIds.filter(id => qCache.get(id)).map(id => questionBlockHTML(id, ++n, opt)).join('');
        const md = (k.markdown || '').trim() ? `<div class="md">${renderMarkdown(k.markdown)}</div>` : '';
        return `<section class="knowledge">${md}${qs ? `<div class="practice"><div class="practice-label">Practice</div>${qs}</div>` : ''}</section>`;
    }).join('');
    return `<article class="chapter"><h1 class="chapter-title">${esc(ch.title)}</h1>${ks || '<p class="muted">This chapter has no content yet.</p>'}</article>`;
}

/* ------------------------------------------------------------------ render */
function render(scrollTop) {
    document.body.classList.toggle('manage', state.mode === 'manage');
    document.body.classList.toggle('print-all-solutions', state.printSolutions);
    $$('.mode-switch button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
    renderNav();
    if (state.mode === 'manage') renderManage(); else renderView();
    updateSaveBar();
    if (scrollTop) window.scrollTo(0, 0);
}

function renderNav() {
    const nav = $('#chapterNav');
    if (!state.chapters.length) { nav.innerHTML = '<div class="nav-empty">No chapters yet</div>'; return; }
    nav.innerHTML = state.chapters.map((c, i) => `
        <div class="nav-row${c.id === state.currentId ? ' active' : ''}">
            <button class="nav-link" data-act="nav" data-id="${c.id}"><span class="nav-num">${i + 1}</span><span class="nav-title">${esc(c.title)}</span></button>
            <span class="nav-tools manage-only">
                <button class="nav-mini" data-act="ch-up" data-id="${c.id}" title="Move chapter up" ${i === 0 ? 'disabled' : ''}>↑</button>
                <button class="nav-mini" data-act="ch-down" data-id="${c.id}" title="Move chapter down" ${i === state.chapters.length - 1 ? 'disabled' : ''}>↓</button>
            </span>
        </div>`).join('');
}

async function renderView() {
    const token = ++state.renderToken;
    const box = $('#content');
    if (!state.chapters.length) {
        setHTML(box, `<div class="empty"><h2>No chapters yet</h2><p>Switch to Management mode to create the first chapter.</p></div>`);
        return;
    }
    const ch = currentChapter();
    if (!ch) {
        setHTML(box, `<div class="empty"><h2>Choose a chapter</h2><p>Pick a chapter from the menu on the left.</p></div>`);
        return;
    }
    setHTML(box, '<div class="loading">Loading chapter…</div>');
    await ensureQuestions(ch.knowledges.flatMap(k => k.questionIds), true);
    if (token !== state.renderToken) return; // user navigated away meanwhile
    setHTML(box, buildChapterHTML(ch) + `
        <div class="footer-actions">
            <span class="fa-title">Print or export this chapter</span>
            <label class="check"><input type="checkbox" id="optSolutions" ${state.printSolutions ? 'checked' : ''}> Include all solutions</label>
            <button class="btn" data-act="print">Print / Save as PDF</button>
            <button class="btn secondary" data-act="export-html">Download as HTML</button>
        </div>`);
    typeset(box);
}

function renderManage() {
    state.renderToken++;
    const box = $('#content');
    const ch = state.draft;
    if (!ch) {
        setHTML(box, `<div class="empty"><h2>No chapter selected</h2><p>Create a chapter to start adding knowledge and practice questions.</p>
            <button class="btn" data-act="ch-new">New chapter</button></div>`);
        return;
    }
    const y = window.scrollY;
    let n = 0;
    const ks = ch.knowledges.map((k, ki) => {
        const qs = k.questionIds.map((id, qi) => questionBlockHTML(id, ++n, { manage: true, k: ki, qi })).join('');
        return `
        <section class="k-card" data-k="${ki}">
            <div class="k-head">
                <span class="k-label">Knowledge ${ki + 1}</span>
                <div class="k-tools">
                    <button class="mini" data-act="k-up" data-k="${ki}" title="Move up" ${ki === 0 ? 'disabled' : ''}>↑</button>
                    <button class="mini" data-act="k-down" data-k="${ki}" title="Move down" ${ki === ch.knowledges.length - 1 ? 'disabled' : ''}>↓</button>
                    <button class="mini danger" data-act="k-delete" data-k="${ki}">Delete</button>
                </div>
            </div>
            <div class="k-edit">
                <div class="k-col">
                    <label for="md-${ki}">Markdown (use $…$ or $$…$$ for LaTeX)</label>
                    <textarea id="md-${ki}" class="md-input" data-k="${ki}" spellcheck="false" placeholder="Write the knowledge here in Markdown…">${esc(k.markdown)}</textarea>
                </div>
                <div class="k-col">
                    <label>Preview</label>
                    <div class="md preview" data-preview="${ki}">${k.markdown.trim() ? renderMarkdown(k.markdown) : '<p class="muted">The preview appears here as you type.</p>'}</div>
                </div>
            </div>
            <div class="k-questions">
                <div class="practice"><div class="practice-label">Practice questions (${k.questionIds.length})</div>
                ${qs || '<p class="muted small">No practice questions yet.</p>'}</div>
                <button class="btn secondary" data-act="q-add" data-k="${ki}">Insert practice questions…</button>
            </div>
        </section>`;
    }).join('');

    setHTML(box, `
        <div class="m-head">
            <div class="field"><label for="titleInput">Chapter title</label>
                <input id="titleInput" type="text" value="${esc(ch.title)}" placeholder="Chapter title"></div>
            <button class="btn danger" data-act="ch-delete">Delete chapter</button>
        </div>
        ${ks}
        <button class="add-k" data-act="k-add">Add knowledge</button>`);
    $$('.md-input', box).forEach(autosize);
    typeset(box);
    window.scrollTo(0, y);
}

function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(170, ta.scrollHeight + 2) + 'px';
}

function updateSaveBar() {
    const s = $('#saveStatus'), b = $('#saveBtn');
    s.textContent = state.saving ? 'Saving…' : state.dirty ? 'Unsaved changes' : 'All changes saved';
    s.classList.toggle('dirty', state.dirty && !state.saving);
    b.disabled = !state.dirty || state.saving || !state.draft;
}
function setDirty(v) { state.dirty = v; updateSaveBar(); }

/* -------------------------------------------------------- navigation / modes */
function selectChapter(id) {
    if (state.dirty && !confirm('You have unsaved changes. Discard them?')) return false;
    state.currentId = id;
    state.dirty = false;
    const ch = currentChapter();
    state.draft = (state.mode === 'manage' && ch) ? clone(ch) : null;
    try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (e) {}
    document.title = ch ? ch.title + ' | AMC Study Notes' : 'AMC Study Notes';
    closeSidebar();
    render(true);
    return true;
}

function setMode(mode) {
    if (mode === state.mode) return;
    if (mode === 'manage') {
        if (!state.authed) { openLogin(() => setMode('manage')); return; }
        state.mode = 'manage';
        state.draft = currentChapter() ? clone(currentChapter()) : null;
        state.dirty = false;
    } else {
        if (state.dirty && !confirm('Discard unsaved changes and go back to view mode?')) return;
        state.mode = 'view';
        state.draft = null;
        state.dirty = false;
    }
    closeSidebar();
    render();
}

function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }

/* ------------------------------------------------------------------ login */
let afterLogin = null;
function openLogin(cb) {
    afterLogin = cb || null;
    $('#loginErr').textContent = '';
    $('#loginPass').value = '';
    $('#loginModal').classList.add('show');
    setTimeout(() => $('#loginUser').focus(), 30);
}
function closeLogin() { $('#loginModal').classList.remove('show'); afterLogin = null; }
async function doLogin() {
    const u = $('#loginUser').value, p = $('#loginPass').value;
    const btn = $('#loginBtn');
    btn.disabled = true;
    try {
        const snap = await getDocs(query(collection(db, COL_MASTER), where("username", "==", u), where("password", "==", p)));
        if (!snap.empty) {
            state.authed = true;
            const cb = afterLogin;
            closeLogin();
            if (cb) cb();
        } else {
            $('#loginErr').textContent = 'Wrong username or password.';
        }
    } catch (e) {
        $('#loginErr').textContent = 'Could not log in: ' + e.message;
    }
    btn.disabled = false;
}

/* ------------------------------------------------------- chapter operations */
async function createChapter() {
    if (state.dirty && !confirm('You have unsaved changes. Discard them?')) return;
    const nextOrder = state.chapters.reduce((m, c) => Math.max(m, c.order), 0) + 1;
    try {
        const ref = await addDoc(collection(db, COL_CHAPTER), {
            title: 'Untitled chapter', order: nextOrder, knowledges: [],
            createdAt: new Date(), updatedAt: new Date()
        });
        state.chapters.push({ id: ref.id, title: 'Untitled chapter', order: nextOrder, knowledges: [] });
        state.dirty = false;
        selectChapter(ref.id);
        setTimeout(() => { const t = $('#titleInput'); if (t) { t.focus(); t.select(); } }, 50);
    } catch (e) { toast('Could not create chapter: ' + e.message, 'error'); }
}

async function deleteChapter() {
    const ch = currentChapter();
    if (!ch) return;
    if (!confirm(`Delete the chapter "${ch.title}" and all of its knowledge? The questions themselves stay in the database. This cannot be undone.`)) return;
    try {
        await deleteDoc(doc(db, COL_CHAPTER, ch.id));
        state.chapters = state.chapters.filter(c => c.id !== ch.id);
        state.dirty = false;
        selectChapter(state.chapters[0] ? state.chapters[0].id : null);
        toast('Chapter deleted');
    } catch (e) { toast('Could not delete: ' + e.message, 'error'); }
}

async function moveChapter(id, dir) {
    const arr = state.chapters;
    const i = arr.findIndex(c => c.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    const batch = writeBatch(db);
    let changes = 0;
    arr.forEach((c, idx) => {
        if (c.order !== idx + 1) { c.order = idx + 1; batch.update(doc(db, COL_CHAPTER, c.id), { order: c.order }); changes++; }
    });
    renderNav();
    try { if (changes) await batch.commit(); }
    catch (e) { toast('Could not reorder: ' + e.message, 'error'); await loadChapters(); renderNav(); }
}

async function saveDraft() {
    const d = state.draft;
    if (!d || state.saving) return;
    const title = (d.title || '').trim();
    if (!title) { toast('The chapter needs a title.', 'error'); return; }
    state.saving = true; updateSaveBar();
    try {
        const knowledges = d.knowledges.map(k => ({ id: k.id, markdown: k.markdown || '', questionIds: [...k.questionIds] }));
        await setDoc(doc(db, COL_CHAPTER, d.id), { title, knowledges, updatedAt: new Date() }, { merge: true });
        const ch = currentChapter();
        if (ch) { ch.title = title; ch.knowledges = clone(knowledges); }
        d.title = title;
        state.dirty = false;
        document.title = title + ' | AMC Study Notes';
        renderNav();
        toast('Saved');
    } catch (e) {
        toast('Could not save: ' + e.message, 'error');
    }
    state.saving = false; updateSaveBar();
}

/* --------------------------------------------------- knowledge / question ops */
function moveInArray(arr, i, dir) {
    const j = i + dir;
    if (j < 0 || j >= arr.length) return false;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return true;
}

/* ------------------------------------------------------ question picker modal */
const PAGE = 30;
const picker = { ki: null, selected: new Set(), search: '', diffOnly: false, groupSel: new Map(), page: 1, all: [], cats: [], catName: {} };

async function openPicker(ki) {
    picker.ki = ki;
    picker.selected = new Set();
    picker.search = ''; picker.diffOnly = false; picker.groupSel = new Map(); picker.page = 1;
    $('#pickSearch').value = ''; $('#pickDiff').checked = false;
    $('#pickerModal').classList.add('show');
    document.body.style.overflow = 'hidden';
    $('#pickList').innerHTML = '<div class="loading">Loading questions…</div>';
    $('#pickGroups').innerHTML = '';
    updatePickCount();
    try {
        const [cs, qs] = await Promise.all([getDocs(collection(db, COL_CATEGORY)), getDocs(collection(db, COL_QUESTION))]);
        picker.cats = []; picker.catName = {};
        cs.forEach(d => {
            const x = d.data();
            picker.cats.push({ id: d.id, name: x.name || '', order: x.order || 0, parent: getParentId(x) });
            picker.catName[d.id] = x.name || '';
        });
        picker.all = [];
        qs.forEach(d => { const x = d.data(); qCache.set(d.id, x); picker.all.push({ ...x, id: d.id }); });
        picker.all.sort((a, b) => millis(b.createdAt) - millis(a.createdAt));
        renderPickerFilters();
        renderPickerResults();
    } catch (e) {
        $('#pickList').innerHTML = `<div class="loading">Could not load questions: ${esc(e.message)}</div>`;
    }
}
function closePicker() {
    $('#pickerModal').classList.remove('show');
    document.body.style.overflow = '';
    picker.ki = null;
}

function descendants(id) {
    const kids = picker.cats.filter(c => c.parent === id).sort((a, b) => a.order - b.order);
    return kids.flatMap(k => [k, ...descendants(k.id)]);
}
function renderPickerFilters() {
    const roots = picker.cats.filter(c => !c.parent).sort((a, b) => a.order - b.order);
    $('#pickGroups').innerHTML = roots.map(r => {
        const desc = descendants(r.id);
        if (!desc.length) return '';
        const sel = picker.groupSel.get(r.id) || new Set();
        return `<div class="fgroup"><div class="fgroup-label">${esc(r.name)}</div><div class="chips">
            ${desc.map(c => `<button type="button" class="chip${sel.has(c.id) ? ' on' : ''}" data-root="${r.id}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}
        </div></div>`;
    }).join('');
}
function pickerFiltered() {
    const s = picker.search.trim().toLowerCase();
    return picker.all.filter(q => {
        if (picker.diffOnly && !q.isDifficult) return false;
        if (s && !((q.latexQuestion || '') + ' ' + (q.latexSolution || '')).toLowerCase().includes(s)) return false;
        for (const [, set] of picker.groupSel) {
            if (set.size && !(q.categories || []).some(id => set.has(id))) return false;
        }
        return true;
    });
}
function renderPickerResults() {
    const list = pickerFiltered();
    const shown = list.slice(0, picker.page * PAGE);
    const existing = new Set(state.draft && picker.ki !== null ? state.draft.knowledges[picker.ki].questionIds : []);
    const box = $('#pickList');
    setHTML(box, shown.length ? shown.map(q => {
        const already = existing.has(q.id);
        const tags = (q.categories || []).map(id => `<span class="tag">${esc(picker.catName[id] || '…')}</span>`).join('');
        const flags = (q.isDifficult ? '<span class="badge-diff" style="font-size:11px">Difficult</span>' : '') + (already ? '<span class="tag note">Already in this knowledge</span>' : '');
        return `<div class="pick-item${picker.selected.has(q.id) ? ' selected' : ''}${already ? ' already' : ''}" data-id="${q.id}">
            <div class="pick-check"></div>
            <div><div class="pick-meta">${tags}${flags}</div><div class="pick-text">${renderRich(q.latexQuestion)}</div></div>
            ${q.diagramUrl ? `<img class="pick-thumb" src="${esc(q.diagramUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '<span></span>'}
        </div>`;
    }).join('') : '<div class="loading">No questions match these filters.</div>');
    $('#pickInfo').textContent = `${list.length} matching question${list.length === 1 ? '' : 's'}` + (list.length > shown.length ? ` (showing ${shown.length})` : '');
    if (list.length > shown.length) box.insertAdjacentHTML('beforeend', '<div class="pick-more"><button class="btn secondary" data-act="pick-more">Show more</button></div>');
    typeset(box);
}
function updatePickCount() {
    const n = picker.selected.size;
    $('#pickSelCount').textContent = n + ' selected';
    $('#pickInsert').disabled = n === 0;
}
function insertPicked() {
    if (picker.ki === null || !state.draft) return;
    const k = state.draft.knowledges[picker.ki];
    let added = 0;
    picker.selected.forEach(id => { if (!k.questionIds.includes(id)) { k.questionIds.push(id); added++; } });
    closePicker();
    if (added) { setDirty(true); renderManage(); toast(`${added} question${added === 1 ? '' : 's'} inserted. Remember to save.`); }
}

/* -------------------------------------------------------------------- export */
function exportHTML() {

    const css = $('#content-style').textContent;

<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>${css}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans)}
.sheet{max-width:860px;margin:32px auto;background:#fff;padding:52px 60px;border:1px solid var(--line);border-radius:4px}
@media (max-width:700px){.sheet{margin:0;padding:28px 18px;border:0}}
@media print{body{background:#fff}.sheet{margin:0;padding:0;border:0;max-width:none}}
</style>
<script>window.MathJax=${JSON.stringify(window.MJ_CFG)};<\/script>

</head><body><main class="sheet">${body}</main>

    const name = (ch.title.replace(/[\\/:*?"<>|]+/g, '').trim().replace(/\s+/g, '_')) || 'chapter';

/* ------------------------------------------------------------ event wiring */
const previewTimers = {};
function schedulePreview(ki) {
    clearTimeout(previewTimers[ki]);
    previewTimers[ki] = setTimeout(() => {
        const pv = $(`[data-preview="${ki}"]`);
        if (!pv || !state.draft) return;
        const md = state.draft.knowledges[ki].markdown;
        setHTML(pv, md.trim() ? renderMarkdown(md) : '<p class="muted">The preview appears here as you type.</p>');
        typeset(pv);
    }, 250);
}

const actions = {
    'nav': el => selectChapter(el.dataset.id),
    'mode': el => setMode(el.dataset.mode),
    'ch-new': () => createChapter(),
    'ch-delete': () => deleteChapter(),
    'ch-up': el => moveChapter(el.dataset.id, -1),
    'ch-down': el => moveChapter(el.dataset.id, 1),
    'close-sidebar': () => closeSidebar(),
    'toggle-sol': el => {
        const s = el.nextElementSibling;
        const open = s.classList.toggle('open');
        el.textContent = open ? 'Hide solution' : 'Show solution';
    },
    'save': () => saveDraft(),
    'print': () => window.print(),
    'export-html': () => exportHTML(),
    'k-add': () => {
        state.draft.knowledges.push({ id: uid(), markdown: '', questionIds: [] });
        setDirty(true); renderManage();
        const cards = $$('.k-card');
        const last = cards[cards.length - 1];
        if (last) { last.scrollIntoView({ block: 'center' }); const t = $('.md-input', last); if (t) t.focus(); }
    },
    'k-up': el => { if (moveInArray(state.draft.knowledges, +el.dataset.k, -1)) { setDirty(true); renderManage(); } },
    'k-down': el => { if (moveInArray(state.draft.knowledges, +el.dataset.k, 1)) { setDirty(true); renderManage(); } },
    'k-delete': el => {
        const k = state.draft.knowledges[+el.dataset.k];
        const extra = k.questionIds.length ? ` It has ${k.questionIds.length} practice question link(s); the questions stay in the database.` : '';
        if (!confirm('Delete this knowledge?' + extra)) return;
        state.draft.knowledges.splice(+el.dataset.k, 1);
        setDirty(true); renderManage();
    },
    'q-up': el => { if (moveInArray(state.draft.knowledges[+el.dataset.k].questionIds, +el.dataset.q, -1)) { setDirty(true); renderManage(); } },
    'q-down': el => { if (moveInArray(state.draft.knowledges[+el.dataset.k].questionIds, +el.dataset.q, 1)) { setDirty(true); renderManage(); } },
    'q-remove': el => { state.draft.knowledges[+el.dataset.k].questionIds.splice(+el.dataset.q, 1); setDirty(true); renderManage(); },
    'q-add': el => openPicker(+el.dataset.k),
    'pick-close': () => closePicker(),
    'pick-insert': () => insertPicked(),
    'pick-more': () => { picker.page++; renderPickerResults(); },
    'pick-all': () => {
        const existing = new Set(state.draft.knowledges[picker.ki].questionIds);
        pickerFiltered().forEach(q => { if (!existing.has(q.id)) picker.selected.add(q.id); });
        renderPickerResults(); updatePickCount();
    },
    'pick-clear': () => { picker.selected.clear(); renderPickerResults(); updatePickCount(); },
    'pick-reset': () => {
        picker.search = ''; picker.diffOnly = false; picker.groupSel = new Map(); picker.page = 1;
        $('#pickSearch').value = ''; $('#pickDiff').checked = false;
        renderPickerFilters(); renderPickerResults();
    },
    'login-submit': () => doLogin(),
    'login-cancel': () => closeLogin()
};

document.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) {
        const root = chip.dataset.root, cat = chip.dataset.cat;
        if (!picker.groupSel.has(root)) picker.groupSel.set(root, new Set());
        const set = picker.groupSel.get(root);
        set.has(cat) ? set.delete(cat) : set.add(cat);
        chip.classList.toggle('on', set.has(cat));
        picker.page = 1;
        renderPickerResults();
        return;
    }
    const item = e.target.closest('.pick-item');
    if (item && !item.classList.contains('already')) {
        const id = item.dataset.id;
        picker.selected.has(id) ? picker.selected.delete(id) : picker.selected.add(id);
        item.classList.toggle('selected', picker.selected.has(id));
        updatePickCount();
        return;
    }
    const el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act]) actions[el.dataset.act](el, e);
    // click on the dark backdrop closes the picker
    if (e.target.id === 'pickerModal') closePicker();
});

document.addEventListener('input', e => {
    const t = e.target;
    if (t.classList.contains('md-input')) {
        const ki = +t.dataset.k;
        state.draft.knowledges[ki].markdown = t.value;
        autosize(t);
        setDirty(true);
        schedulePreview(ki);
    } else if (t.id === 'titleInput') {
        state.draft.title = t.value;
        setDirty(true);
    } else if (t.id === 'pickSearch') {
        picker.search = t.value; picker.page = 1; renderPickerResults();
    }
});
document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'pickDiff') { picker.diffOnly = t.checked; picker.page = 1; renderPickerResults(); }
    else if (t.id === 'optSolutions') { state.printSolutions = t.checked; document.body.classList.toggle('print-all-solutions', t.checked); }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if ($('#pickerModal').classList.contains('show')) closePicker();
        else if ($('#loginModal').classList.contains('show')) closeLogin();
        else closeSidebar();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && state.mode === 'manage') { e.preventDefault(); saveDraft(); }
    if (e.key === 'Enter' && (e.target.id === 'loginUser' || e.target.id === 'loginPass')) doLogin();
});
window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });
$('#menuBtn').addEventListener('click', openSidebar);

/* --------------------------------------------------------------------- boot */
(async function init() {
    $('#chapterNav').innerHTML = '<div class="nav-empty">Loading…</div>';
    $('#content').innerHTML = '<div class="loading">Loading…</div>';
    try {
        await loadChapters();
    } catch (e) {
        $('#chapterNav').innerHTML = '';
        $('#content').innerHTML = `<div class="empty"><h2>Could not load chapters</h2><p>${esc(e.message)}</p>
            <p>If this is a permissions error, allow access to the <b>${COL_CHAPTER}</b> collection in your Firestore rules.</p></div>`;
        return;
    }
    const hash = decodeURIComponent(location.hash.slice(1));
    const start = state.chapters.find(c => c.id === hash) || state.chapters[0] || null;
    state.currentId = start ? start.id : null;
    if (start) document.title = start.title + ' | AMC Study Notes';
    render();
})();
</script>
</head>
<body>

<div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Chapters">
        <div class="brand"><b>AMC Study Notes</b><span>Knowledge and practice, chapter by chapter</span></div>
        <div class="nav-head">Chapters</div>
        <nav id="chapterNav"></nav>
        <div class="side-foot manage-only"><button class="btn secondary" data-act="ch-new">New chapter</button></div>
    </aside>
    <div class="scrim" id="scrim" data-act="close-sidebar"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn" id="menuBtn" aria-label="Open chapter menu">☰</button>
            <div class="spacer"></div>
            <div class="mode-switch" role="group" aria-label="Mode">
                <button data-act="mode" data-mode="view" class="active">View</button>
                <button data-act="mode" data-mode="manage">Management</button>
            </div>
        </header>

        <div class="stage">
            <main class="sheet" id="content"></main>
        </div>

        <div class="save-bar manage-only">
            <span id="saveStatus">All changes saved</span>
            <button class="btn" id="saveBtn" data-act="save" disabled>Save changes</button>
        </div>
    </div>
</div>

<!-- Login -->
<div class="modal-back" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="modal login">
        <h2 id="loginTitle">Management login</h2>
        <p class="muted" style="margin:0">Use the same account as the question editor.</p>
        <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
        <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
        <div class="err" id="loginErr"></div>
        <div class="modal-foot">
            <button class="btn secondary" data-act="login-cancel">Cancel</button>
            <button class="btn" id="loginBtn" data-act="login-submit">Log in</button>
        </div>
    </div>
</div>

<!-- Question picker -->
<div class="modal-back" id="pickerModal" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <div class="modal picker">
        <div class="modal-head">
            <h2 id="pickTitle">Insert practice questions</h2>
            <button class="icon-btn" data-act="pick-close" aria-label="Close">✕</button>
        </div>
        <div class="pick-layout">
            <aside class="pick-filters" aria-label="Filters">
                <div class="pick-filters-title">Filters <button class="linkbtn" data-act="pick-reset">Clear filters</button></div>
                <input type="search" id="pickSearch" placeholder="Search question or solution text">
                <label class="check"><input type="checkbox" id="pickDiff"> Difficult only</label>
                <div id="pickGroups"></div>
            </aside>
            <section class="pick-results">
                <div class="pick-bar">
                    <span id="pickInfo"></span>
                    <span><button class="linkbtn" data-act="pick-all">Select all matching</button><button class="linkbtn" data-act="pick-clear">Clear selection</button></span>
                </div>
                <div class="pick-list" id="pickList"></div>
            </section>
        </div>
        <div class="modal-foot">
            <span id="pickSelCount">0 selected</span>
            <div>
                <button class="btn secondary" data-act="pick-close">Cancel</button>
                <button class="btn" id="pickInsert" data-act="pick-insert" disabled>Insert selected</button>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>

</body>
</html>
